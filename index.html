  <body class="bg-[#f8f7fc] text-slate-800 font-['Vazirmatn',sans-serif] antialiased selection:bg-purple-600 selection:text-white">
    <div id="root"></div>
    <script>
      (function() {
        // Anti-sanction proxy for Iranian users (routes blocked Google/Firebase endpoints through server)
        if (typeof window !== 'undefined') {
          function rewriteTargetUrl(u) {
            if (!u || typeof u !== 'string') return u;
            if (u.indexOf('https://www.googleapis.com/identitytoolkit') === 0) {
              return u.replace('https://www.googleapis.com/identitytoolkit', window.location.origin + '/api/proxy-googleapis-identitytoolkit');
            }
            if (u.indexOf('https://identitytoolkit.googleapis.com') === 0) {
              return u.replace('https://identitytoolkit.googleapis.com', window.location.origin + '/api/proxy-identitytoolkit');
            }
            if (u.indexOf('https://securetoken.googleapis.com') === 0) {
              return u.replace('https://securetoken.googleapis.com', window.location.origin + '/api/proxy-securetoken');
            }
            if (u.indexOf('https://firestore.googleapis.com') === 0) {
              return u.replace('https://firestore.googleapis.com', window.location.origin + '/api/proxy-firestore');
            }
            return u;
          }

          var originalFetch = window.fetch;
          window.fetch = function(input, init) {
            try {
              if (typeof input === 'string') {
                input = rewriteTargetUrl(input);
              } else if (input && typeof input.url === 'string') {
                var rewritten = rewriteTargetUrl(input.url);
                if (rewritten !== input.url) {
                  input = new Request(rewritten, input);
                }
              } else if (input && input.href) {
                input = rewriteTargetUrl(input.href);
              }
            } catch (e) {}
            return originalFetch.call(this, input, init);
          };

          if (window.XMLHttpRequest) {
            var originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
              try {
                if (typeof url === 'string') {
                  url = rewriteTargetUrl(url);
                }
              } catch (e) {}
              return originalOpen.apply(this, arguments);
            };
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
